<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olá Mundo</title>
    <meta name="description" content="Site simples com fundo preto e uma caixa de texto no meio dizendo Olá mundo!" />
    <meta property="og:title" content="Olá Mundo" />
    <meta property="og:description" content="Site simples com fundo preto e uma caixa de texto no meio dizendo Olá mundo!" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .card {
        background-color: #111111;
        border: 1px solid #27272a;
        border-radius: 12px;
        padding: 2.5rem 3.5rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        text-align: center;
        max-width: 480px;
        width: 100%;
      }

      .card h1 {
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #f4f4f5;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <div class="card" id="message-box">
      <h1 id="greeting-text">Olá mundos!</h1>
    </div>
  </body>
</html>
